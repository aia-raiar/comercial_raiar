<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Teste de Conexão – SharePoint Raiar</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/msal/2.38.3/msal-browser.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; color: #222; }
  h1 { font-size: 20px; }
  button { background: #2563eb; color: white; border: none; padding: 10px 18px; border-radius: 6px; font-size: 15px; cursor: pointer; }
  button:disabled { background: #93c5fd; cursor: default; }
  #log { background: #f4f4f4; border-radius: 8px; padding: 14px; margin-top: 20px; font-family: monospace; font-size: 13px; white-space: pre-wrap; max-height: 400px; overflow-y: auto; }
  .item { padding: 8px; border-bottom: 1px solid #e5e5e5; }
  .item b { color: #1d4ed8; }
  .err { color: #b91c1c; }
  .ok { color: #15803d; }
</style>
</head>
<body>

<h1>Teste de Conexão — SharePoint Raiar Orgânicos</h1>
<p>Esta é uma página de <b>teste técnico</b>, não o painel final. Ela apenas confirma se o login e a leitura via Microsoft Graph API funcionam antes de construirmos o dashboard real.</p>

<button id="btnLogin">Entrar com conta Microsoft</button>
<div id="log"></div>

<script>
// ===== CONFIGURAÇÃO =====
// Client ID e Tenant ID do app registrado no Azure AD (não são segredos, são identificadores públicos do app)
const msalConfig = {
  auth: {
    clientId: "538ecaea-c22a-4502-8f24-138199312916",
    authority: "https://login.microsoftonline.com/6c305056-e26e-49fd-82f1-e9eb7cae3c4b",
    redirectUri: "http://localhost:3000"
  },
  cache: {
    cacheLocation: "sessionStorage" // não persiste entre sessões do navegador
  }
};

const logEl = document.getElementById('log');
const btnLogin = document.getElementById('btnLogin');

function log(msg, cls) {
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = msg;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

// Captura QUALQUER erro de JavaScript, mesmo antes do clique, e mostra na tela.
// Isso é essencial no celular, onde não é fácil abrir o console do navegador.
window.addEventListener('error', (event) => {
  log('ERRO JS: ' + event.message, 'err');
});
window.addEventListener('unhandledrejection', (event) => {
  log('ERRO (promise): ' + (event.reason && event.reason.message ? event.reason.message : event.reason), 'err');
});

log('Verificando se a biblioteca MSAL carregou...');
if (typeof msal === 'undefined') {
  log('FALHA: a biblioteca MSAL.js não carregou (variável "msal" não existe).', 'err');
  log('Possíveis causas: bloqueador de anúncios/rastreadores no navegador, ou falha de rede ao carregar o CDN.', 'err');
  log('Tente desativar temporariamente o bloqueador de anúncios/proteção de rastreamento deste site, ou abra em uma aba anônima.', 'err');
} else {
  log('Biblioteca MSAL carregada com sucesso.', 'ok');
}

const msalInstance = typeof msal !== 'undefined' ? new msal.PublicClientApplication(msalConfig) : null;
const graphScopes = ["Sites.Read.All", "User.Read"];

async function getToken() {
  const accounts = msalInstance.getAllAccounts();
  const request = { scopes: graphScopes, account: accounts[0] };
  try {
    const result = await msalInstance.acquireTokenSilent(request);
    return result.accessToken;
  } catch (e) {
    await msalInstance.acquireTokenRedirect(request);
    // acquireTokenRedirect navega para fora da página; nada mais executa aqui.
  }
}

async function runDataFetch() {
  try {
    log('Obtendo token de acesso...');
    const token = await getToken();
    if (!token) return; // redirecionamento em andamento
    log('Token obtido com sucesso.', 'ok');

    log('Buscando o site "ControleseProcessos-RAIARORGNICOS"...');
    const site = await graphGet(
      '/sites/organicosraiar.sharepoint.com:/sites/ControleseProcessos-RAIARORGNICOS',
      token
    );
    log(`Site encontrado: ${site.displayName} (id: ${site.id})`, 'ok');

    log('Listando arquivos na raiz da biblioteca de documentos...');
    const drive = await graphGet(`/sites/${site.id}/drive/root/children`, token);

    log(`${drive.value.length} itens encontrados na raiz:`, 'ok');
    drive.value.forEach(item => {
      const div = document.createElement('div');
      div.className = 'item';
      const tipo = item.folder ? '📁 pasta' : '📄 arquivo';
      div.innerHTML = `<b>${item.name}</b> — ${tipo}${item.file ? ` (${(item.size/1024).toFixed(0)} KB)` : ''}`;
      logEl.appendChild(div);
    });

    log('---');
    log('Se sua planilha não aparece na raiz, ela está em uma subpasta.');
    log('Me diga o nome da pasta e eu ajusto a busca para entrar nela.');

  } catch (e) {
    log('ERRO: ' + e.message, 'err');
    if (e.message.includes('AADSTS90094') || e.message.includes('consent')) {
      log('Isso confirma que falta o "admin consent" — leve este erro para quem tem Global Administrator.', 'err');
    }
  } finally {
    btnLogin.disabled = false;
  }
}

async function graphGet(path, token) {
  const res = await fetch(`https://graph.microsoft.com/v1.0${path}`, {
    headers: { Authorization: `Bearer ${token}` }
  });
  if (!res.ok) {
    const body = await res.text();
    throw new Error(`${res.status} ${res.statusText}: ${body}`);
  }
  return res.json();
}

btnLogin.addEventListener('click', async () => {
  log('Botão clicado.');
  if (!msalInstance) {
    log('Não é possível continuar: a biblioteca MSAL não carregou (veja mensagem de erro acima).', 'err');
    return;
  }
  btnLogin.disabled = true;
  const accounts = msalInstance.getAllAccounts();
  if (accounts.length > 0) {
    // já logado nesta sessão: só busca os dados
    await runDataFetch();
    return;
  }
  log('Redirecionando para o login da Microsoft...');
  try {
    await msalInstance.loginRedirect({ scopes: graphScopes });
    // a página navega para fora; nada mais executa aqui.
  } catch (e) {
    log('ERRO ao iniciar login: ' + e.message, 'err');
    btnLogin.disabled = false;
  }
});

// Ao carregar a página (inclusive depois de voltar do redirect de login), processa o retorno
(async () => {
  try {
    const response = await msalInstance.handleRedirectPromise();
    if (response) {
      msalInstance.setActiveAccount(response.account);
      log(`Login OK: ${response.account.username}`, 'ok');
      btnLogin.disabled = true;
      await runDataFetch();
    } else {
      const accounts = msalInstance.getAllAccounts();
      if (accounts.length > 0) {
        log(`Sessão já autenticada: ${accounts[0].username}`, 'ok');
      }
    }
  } catch (e) {
    log('ERRO no retorno do login: ' + e.message, 'err');
    if (e.message.includes('AADSTS90094') || e.message.includes('consent')) {
      log('Isso confirma que falta o "admin consent" — leve este erro para quem tem Global Administrator.', 'err');
    }
  }
})();
</script>
</body>
</html>
